<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How one reverie-automata cycle works</title>
  <desc id="desc">A deterministic gate wakes the agent for idle time, due work, or both. Context flows into planning, safe execution, and learning. Tool calls pass through an inspector and risky actions wait for exact approval. Results return to durable state for the next cycle.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090e1b"/>
      <stop offset="0.58" stop-color="#11172a"/>
      <stop offset="1" stop-color="#171229"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5ce7"/>
      <stop offset="1" stop-color="#9b6df2"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#386bd8"/>
      <stop offset="1" stop-color="#5f8ff2"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9e4d9f"/>
      <stop offset="1" stop-color="#d06e9c"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171c31"/>
      <stop offset="0.5" stop-color="#1d2139"/>
      <stop offset="1" stop-color="#211a35"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#d9d2ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d9d2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#03050b" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#858ca8"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a99bf8"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill:#aaa4c5; font-size:11px; font-weight:700; letter-spacing:1.8px; }
      .headline { fill:#f6f3ff; font-size:23px; font-weight:750; }
      .title { fill:#faf8ff; font-size:18px; font-weight:750; }
      .copy { fill:#bbb8cb; font-size:12.5px; }
      .tiny { fill:#9793aa; font-size:11px; }
      .step { fill:#ffffff; font-size:11px; font-weight:800; letter-spacing:1.4px; }
      .chip { fill:#c8c3da; font-size:11px; font-weight:600; }
      .line { stroke:#858ca8; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .feedback { stroke:#a99bf8; stroke-width:2; fill:none; marker-end:url(#arrowViolet); }
      .icon { stroke:#f7f4ff; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="960" height="560" rx="28" fill="url(#night)"/>
  <circle cx="858" cy="58" r="92" fill="url(#moonGlow)"/>
  <circle cx="856" cy="56" r="24" fill="#d8d1ff" opacity="0.95"/>
  <circle cx="867" cy="48" r="24" fill="#11172a"/>
  <g fill="#b9afff">
    <circle cx="85" cy="44" r="1.8"/><circle cx="188" cy="72" r="1.2"/>
    <circle cx="660" cy="42" r="1.4"/><circle cx="785" cy="80" r="1.2"/>
    <circle cx="906" cy="119" r="1.5"/><circle cx="43" cy="126" r="1.1"/>
  </g>

  <text class="eyebrow" x="42" y="44">ONE SMALL CYCLE</text>
  <text class="headline" x="42" y="72">Wake, do something useful, leave a note.</text>

  <g transform="translate(685 26)">
    <rect width="205" height="70" rx="16" fill="#1d2034" stroke="#77708f" stroke-width="1.3"/>
    <g transform="translate(17 18)">
      <path class="icon" d="M9 0 17 4v7c0 6-4 9-8 11-4-2-8-5-8-11V4Z"/>
      <path class="icon" d="m5.5 10 2.2 2.2 4.8-5"/>
    </g>
    <text class="title" x="50" y="28">Wake gate</text>
    <text class="copy" x="50" y="49">idle · due work · or both</text>
    <text class="tiny" x="50" y="64">window · caps · budget · kill</text>
  </g>

  <path class="line" d="M787 98 C787 132 375 116 375 166"/>
  <text class="tiny" x="659" y="118" text-anchor="middle">pure · no model call</text>

  <g transform="translate(42 142)" filter="url(#shadow)">
    <rect width="206" height="244" rx="20" fill="#161b2d" stroke="#383e58" stroke-width="1.4"/>
    <text class="eyebrow" x="20" y="28">WHAT IT SEES</text>
    <text class="title" x="20" y="55">Context, with a queue</text>

    <g transform="translate(20 76)">
      <rect width="76" height="31" rx="10" fill="#20263c" stroke="#3e4664"/>
      <path class="icon" d="M12 10h14v11H12zM14 7h10"/>
      <text class="chip" x="35" y="20">inbox</text>
    </g>
    <g transform="translate(104 76)">
      <rect width="82" height="31" rx="10" fill="#20263c" stroke="#3e4664"/>
      <path class="icon" d="M12 8v14M8 12h8M8 18h8"/>
      <text class="chip" x="31" y="20">orders</text>
    </g>
    <g transform="translate(20 115)">
      <rect width="166" height="31" rx="10" fill="#20263c" stroke="#3e4664"/>
      <path class="icon" d="M10 9h16M10 15h16M10 21h10"/>
      <text class="chip" x="37" y="20">due threads</text>
    </g>
    <g transform="translate(20 154)">
      <rect width="76" height="31" rx="10" fill="#20263c" stroke="#3e4664"/>
      <path class="icon" d="M11 21V9l7-3 7 3v12l-7-3z"/>
      <text class="chip" x="35" y="20">lessons</text>
    </g>
    <g transform="translate(104 154)">
      <rect width="82" height="31" rx="10" fill="#20263c" stroke="#3e4664"/>
      <path class="icon" d="M11 20 17 8l6 12M13 16h8"/>
      <text class="chip" x="31" y="20">sources</text>
    </g>
    <text class="tiny" x="20" y="218">Nothing due? No expensive call.</text>
  </g>

  <path class="line" d="M250 264 H286"/>

  <g transform="translate(288 168)" filter="url(#shadow)">
    <rect width="174" height="168" rx="22" fill="url(#violet)"/>
    <circle cx="28" cy="28" r="16" fill="#ffffff" opacity="0.16"/>
    <path class="icon" d="M20 28c5-8 13-8 18 0-5 8-13 8-18 0Zm9 0h.01"/>
    <text class="step" x="20" y="65">01 · LOOK</text>
    <text class="title" x="20" y="94">Choose the work</text>
    <text class="copy" x="20" y="119">typed task menu</text>
    <text class="copy" x="20" y="140">or an honest nothing</text>
  </g>

  <path class="line" d="M464 252 H493"/>

  <g transform="translate(495 168)" filter="url(#shadow)">
    <rect width="174" height="168" rx="22" fill="url(#blue)"/>
    <circle cx="28" cy="28" r="16" fill="#ffffff" opacity="0.16"/>
    <path class="icon" d="m21 22 6 6-6 6M31 34h7"/>
    <text class="step" x="20" y="65">02 · DO</text>
    <text class="title" x="20" y="94">Act with tools</text>
    <text class="copy" x="20" y="119">agent or delegate</text>
    <text class="copy" x="20" y="140">one ledger row per task</text>
  </g>

  <path class="line" d="M671 252 H700"/>

  <g transform="translate(702 168)" filter="url(#shadow)">
    <rect width="216" height="168" rx="22" fill="url(#rose)"/>
    <circle cx="28" cy="28" r="16" fill="#ffffff" opacity="0.16"/>
    <path class="icon" d="M20 22h16v12H20zM24 19v6M32 19v6M24 29h8"/>
    <text class="step" x="20" y="65">03 · CHECK</text>
    <text class="title" x="20" y="94">Learn from evidence</text>
    <text class="copy" x="20" y="119">journal · derived grade</text>
    <text class="copy" x="20" y="140">falsifiable lessons</text>
  </g>

  <g transform="translate(402 360)">
    <rect width="430" height="72" rx="18" fill="#2b2518" stroke="#d8a83d" stroke-width="1.5"/>
    <circle cx="37" cy="36" r="24" fill="#d8a83d" opacity="0.15"/>
    <path d="M37 20 50 26v10c0 10-6 15-13 18-7-3-13-8-13-18V26Z" fill="none" stroke="#f0c45e" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="m31 36 4 4 8-9" fill="none" stroke="#f0c45e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="title" x="75" y="30">Safety lives on the action</text>
    <text class="copy" x="75" y="51">inspector on each call · risky work waits for exact approval</text>
  </g>
  <path class="line" d="M582 338 V358"/>

  <path class="line" d="M870 338 V462"/>
  <path class="feedback" d="M145 462 V390"/>
  <text x="159" y="431" fill="#b8adff" font-size="11" font-weight="650" font-family="ui-sans-serif, system-ui">next cycle reads</text>

  <g transform="translate(42 464)" filter="url(#shadow)">
    <rect width="876" height="70" rx="20" fill="url(#desk)" stroke="#41465f" stroke-width="1.4"/>
    <g transform="translate(22 17)">
      <ellipse cx="18" cy="6" rx="16" ry="6" fill="none" stroke="#a99bf8" stroke-width="2"/>
      <path d="M2 6v22c0 3 7 6 16 6s16-3 16-6V6M2 17c0 3 7 6 16 6s16-3 16-6" fill="none" stroke="#a99bf8" stroke-width="2"/>
    </g>
    <text class="title" x="74" y="29">Durable desk</text>
    <text class="copy" x="74" y="50">state.db: cycles · tasks · journal · threads · approvals · lessons</text>
    <line x1="535" y1="17" x2="535" y2="53" stroke="#41465f"/>
    <text class="copy" x="558" y="28">MEMORY.md · outcome.json · events</text>
    <text class="tiny" x="558" y="49">brain stamp · evidence · blast radius</text>
  </g>

  <text x="480" y="552" text-anchor="middle" fill="#89859d" font-size="11" font-style="italic" font-family="ui-sans-serif, system-ui">persistent state · short-lived worker · your schedule</text>
</svg>
